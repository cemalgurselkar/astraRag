[project]
name = "astrarag"
version = "0.1.0"
description = "A performance-oriented experimental RAG systems engine for benchmarking and adaptive retrieval."
readme = "README.md"
authors = [
    { name = "Cemal Gürsel", email = "cemalgurselkar@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "ranx>=0.3.21",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "structlog>=26.1.0",
    "tqdm>=4.70.1",
]

[project.scripts]
astrarag = "astrarag:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
